name: Fraoula AI — CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '26'
  PYTHON_VERSION: '3.13'

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Lint & type-check the TypeScript / React frontend
  # ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint & type-check (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # 2. Lint & test the Python backend
  # ─────────────────────────────────────────────────────────────
  lint-backend:
    name: Lint & test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff pytest pytest-asyncio httpx

      - name: Ruff lint
        run: ruff check backend/

      - name: Run tests
        run: pytest backend/tests/ -v --tb=short
        continue-on-error: true   # no tests yet; remove once tests are added

  # ─────────────────────────────────────────────────────────────
  # 3. Build the frontend
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: [lint-frontend, lint-backend]
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: .output/public
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # 4. Deploy to Cloudflare Pages (main → production)
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy → Cloudflare Pages (production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .output/public

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=fraoula-ai --branch=main

  # ─────────────────────────────────────────────────────────────
  # 5. Deploy to Cloudflare Pages (staging branch → preview)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Cloudflare Pages (staging preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: .output/public

      - name: Deploy to Cloudflare Pages (staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .output/public --project-name=fraoula-ai --branch=staging
