name = "fraoula-ai"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".output/public"

# ─── Cloudflare D1 (replaces Supabase) ───────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "fraoula-ai-db"
database_id = "8e20bc84-873a-4920-aea4-1ed0ae37d722"

# ─── Cloudflare Workers AI (replaces OpenAI/Anthropic/Google) ────────────────
[ai]
binding = "AI"

# ─── KV (rate limiting + session cache) ──────────────────────────────────────
[[kv_namespaces]]
binding = "FRAOULA_CACHE"
id = "464af04bbee74045a73ba57bf43d2ad6"

# ─── R2 (image storage) — enable R2 in Cloudflare dashboard first ─────────────
# [[r2_buckets]]
# binding = "FRAOULA_IMAGES"
# bucket_name = "fraoula-images"

# ─── Public env vars ─────────────────────────────────────────────────────────
[vars]
APP_ENV = "production"
APP_URL = "https://fraoula-ai.arkajitdas081.workers.dev"
# STRIPE_WEBHOOK_SECRET, STRIPE_SECRET_KEY, JWT_SECRET are set securely via Cloudflare Dashboard / Secrets

# ─── Production environment ──────────────────────────────────────────────────
[env.production]
name = "fraoula-ai"

[env.production.vars]
APP_ENV = "production"
APP_URL = "https://fraoula.co"

# ─── Preview / staging environment ───────────────────────────────────────────
[env.preview]
name = "fraoula-ai-preview"

[env.preview.vars]
APP_ENV = "staging"
APP_URL = "https://fraoula-ai-preview.arkajitdas081.workers.dev"
