name = "fraoula-ai"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".output/public"

# Environment variables (set the real secret values via `wrangler secret put` or the Cloudflare dashboard)
[vars]
SUPABASE_PROJECT_ID = "juveyamanzbqbvckgfag"
VITE_SUPABASE_PROJECT_ID = "juveyamanzbqbvckgfag"
VITE_SUPABASE_URL = "https://juveyamanzbqbvckgfag.supabase.co"

# KV namespace for session / rate-limit state
# Create with: wrangler kv namespace create fraoula-cache
# Then replace the id below with the output
[[kv_namespaces]]
binding = "FRAOULA_CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# R2 bucket for image storage
# Create with: wrangler r2 bucket create fraoula-images
[[r2_buckets]]
binding = "FRAOULA_IMAGES"
bucket_name = "fraoula-images"

[env.production]
name = "fraoula-ai"

[env.staging]
name = "fraoula-ai-staging"
